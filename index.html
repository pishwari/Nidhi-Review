<!DOCTYPE html>
<html>
<head>
  <title>Nidhi Makeup Artist – Lavish Beauty Salon (Alibag)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Analytics (PASTE YOUR ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXX');
  </script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h2 { color: gold; }
    h3 { color: #ffcc70; margin-top: 20px; }

    button {
      margin: 6px;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(45deg, #d4af37, #ffcc70);
      color: black;
      font-weight: bold;
    }

    .selected {
      background: gold !important;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      border-radius: 15px;
      border: 1px solid gold;
    }
  </style>
</head>

<body>

<h2>Nidhi Makeup Artist</h2>
<p>Lavish Beauty Salon, Alibag 💄</p>

<p>Select options & get your review instantly 😊</p>

<h3>⭐ Rate Experience</h3>
<button onclick="setRating('amazing')">⭐⭐⭐⭐⭐</button>
<button onclick="setRating('great')">⭐⭐⭐⭐</button>
<button onclick="setRating('good')">⭐⭐⭐</button>

<h3>💄 Makeup Services</h3>
<button onclick="setService('bridal makeup')">Bridal</button>
<button onclick="setService('party makeup')">Party</button>
<button onclick="setService('engagement makeup')">Engagement</button>

<h3>💇 Salon Services</h3>
<button onclick="setService('facial service')">Facial</button>
<button onclick="setService('hair styling')">Hair</button>
<button onclick="setService('skin care treatment')">Skin Care</button>

<h3>👍 What did you like?</h3>
<button onclick="toggleFeature(this,'friendly staff')">Friendly</button>
<button onclick="toggleFeature(this,'clean and hygienic salon')">Clean</button>
<button onclick="toggleFeature(this,'professional service')">Professional</button>
<button onclick="toggleFeature(this,'affordable pricing')">Affordable</button>
<button onclick="toggleFeature(this,'amazing results')">Results</button>

<div class="box">
  <h3>📝 Your Review</h3>
  <p id="reviewText">Your review will appear here...</p>

  <p style="color:#aaa;">👉 Copy → Paste on Google → Post</p>

  <button onclick="copyText()">📋 Copy & Post Review</button>
</div>

<script>
let rating = "amazing"; // default 5 star
let service = "";
let features = [];

function setRating(r) {
  rating = r;
  generateReview();
}

function setService(s) {
  service = s;
  generateReview();
}

function toggleFeature(btn, f) {
  if(features.includes(f)){
    features = features.filter(x => x !== f);
    btn.classList.remove("selected");
  } else {
    features.push(f);
    btn.classList.add("selected");
  }
  generateReview();
}

function generateReview() {
  let featureText = features.join(", ");

  let endings = [
    "Highly recommended!",
    "Best salon in Alibag!",
    "Top-rated makeup artist near me!",
    "Must visit salon in Alibag!"
  ];

  let randomEnding = endings[Math.floor(Math.random() * endings.length)];

  let review = "I had an " + rating + " experience at Nidhi Makeup Artist – Lavish Beauty Salon in Alibag. ";

  if(service) review += "The " + service + " service was excellent. ";
  if(featureText) review += "I really liked the " + featureText + ". ";

  review += "If you are searching for the best makeup artist near me or salon near me in Alibag, this is highly recommended! ";

  review += randomEnding;

  document.getElementById("reviewText").innerText = review;
}

function copyText() {
  if(!service){
    alert("Please select service");
    return;
  }

  let text = document.getElementById("reviewText").innerText;

  navigator.clipboard.writeText(text).then(function() {

    // Track click
    if(typeof gtag !== "undefined"){
      gtag('event', 'copy_review_clicked');
    }

    // Open Google Review
    window.open("https://g.page/r/CcN8tmuCb_JtEBM/review", "_blank");
  });
}
</script>

</body>
</html>
